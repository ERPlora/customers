# Generator of `handler/src/phone_metadata.rs` (customers#121): reads libphonenumber's metadata
# through the `phonenumber` crate and writes the per-country table the handler normalises with.
# Not part of the handler build (its own workspace); run it by hand when libphonenumber moves:
#   cargo run --release --manifest-path handler/tools/phone-metadata/Cargo.toml > handler/src/phone_metadata.rs
[package]
name = "phone-metadata"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
phonenumber = "=0.3.10"

[workspace]
